<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Корзина | LUTOhayse</title>
    <link rel="icon" type="image/png" href="/media/interface/favicon.png">
    <link rel="stylesheet" href="/cart.css">

    <!-- Yandex.Metrika counter -->

</head>
<body>

<!-- Значок профиля -->
<div class="profile-icon-wrapper" id="profileIcon">
    <a href="/profile" class="profile-fixed-link">
        <img src="/media/interface/profile_icon.svg" alt="Профиль">
    </a>
</div>

<!-- Значок корзины -->
<div class="cart-icon-wrapper">
    <a href="/cart" class="cart-fixed-link">
        <img src="/media/interface/cart_icon.svg" alt="Корзина">
        <span id="cart-count" class="cart-count-badge">0</span>
    </a>
</div>

<header>
    <section class="main__header">
        <div class="header__container">
            <div class="menu__body">
                <nav class="menu__body menu__body-main">
                    <ul class="menu__list">
                        <li class="menu__item site-logo">
                            <h1 class="logo">
                                <a href="/" class="menu__link logo-link">LUTO<span class="logo-sub">hayse</span></a>
                            </h1>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </section>
</header>

<main class="cart-container">
    <h1>Корзина</h1>
    <div id="cart-content"></div>
    <div id="cart-total" class="cart-total"></div>
    <div id="order-form" class="order-form" style="display: none;">
        <h2>Оформление заказа</h2>
        <div id="profileCheckboxDiv" style="margin-bottom: 20px;">
            <label style="cursor: pointer;">
                <input type="checkbox" id="useProfileCheckbox"> Заполнить из профиля
            </label>
            <span id="profileStatus" style="margin-left: 15px; font-size: 14px;"></span>
        </div>
        <form id="order-form-fields">
            <div class="form-group">
                <label>ФИО *</label>
                <input type="text" id="user_name" required>
            </div>
            <div class="form-group">
                <label>Телефон *</label>
                <input type="tel" id="phone" required>
            </div>
            <div class="form-group">
                <label>Электронная почта</label>
                <input type="email" id="email">
            </div>
            <div class="form-group">
                <label>Адрес доставки</label>
                <textarea id="address" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label>Комментарий к заказу</label>
                <textarea id="comment" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Удобное время для связи</label>
                <input type="text" id="contact_time" placeholder="например: с 10 до 18">
            </div>
            <button type="submit" class="submit-order">Оформить заказ</button>
        </form>
    </div>
</main>

<footer>
    <div class="footer-top">
        <div class="footer-left">
            <div class="logo">LUTO<span class="logo-sub">hayse</span></div>
            <div class="phone-label">Звонок по России бесплатный</div>
            <div class="phone-number">8 (999) 700-05-50</div>
            <div style="margin-top: 8px; font-size: 14px; color: #555;">
                Email: <a href="mailto:luto.house@mail.ru" style="color: #628b35; text-decoration: none;">luto.house@mail.ru</a>
            </div>
            <div style="margin-top: 12px;">
                <a href="https://vk.ru/lutohay" target="_blank" style="text-decoration: none; color: #628b35; font-weight: 500;">
                    <img src="/media/interface/vk_icon.svg" alt="ВКонтакте" style="width: 32px; height: 32px; vertical-align: middle; margin-right: 6px;">
                    ВКонтакте
                </a>
            </div>
        </div>
    </div>
    <div class="footer-bottom"><div class="copyright">© Интернет магазин LUTOhayse мебель от производителя</div></div>
</footer>

<script>
    const cartCountSpan = document.getElementById('cart-count');
    const cartContentDiv = document.getElementById('cart-content');
    const cartTotalDiv = document.getElementById('cart-total');
    const orderFormDiv = document.getElementById('order-form');
    const useProfileCheckbox = document.getElementById('useProfileCheckbox');
    const profileStatusSpan = document.getElementById('profileStatus');
    const profileIcon = document.getElementById('profileIcon');

    let currentUser = null;

    // ===== Утилиты =====
    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/[&<>"']/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            if (m === '"') return '&quot;';
            if (m === "'") return '&#39;';
            return m;
        });
    }

    async function fetchCurrentUser() {
        try {
            const resp = await fetch('/api/auth/me');
            const data = await resp.json();
            if (data.authenticated) {
                currentUser = data.user;
                profileStatusSpan.innerHTML = `Вы вошли как ${escapeHtml(currentUser.phone)} <a href="/profile">(профиль)</a>`;
                if (profileIcon) profileIcon.style.background = '#628b35';
                if (useProfileCheckbox.checked) fillFromProfile();
            } else {
                currentUser = null;
                profileStatusSpan.innerHTML = 'Не авторизованы. <a href="/login">Войдите</a> чтобы использовать профиль.';
                if (profileIcon) profileIcon.style.background = '#e3342f';
            }
        } catch(e) { console.error(e); }
    }

    function fillFromProfile() {
        if (!currentUser) {
            alert('Вы не авторизованы. Войдите в аккаунт.');
            useProfileCheckbox.checked = false;
            return;
        }
        document.getElementById('user_name').value = currentUser.full_name || '';
        document.getElementById('phone').value = currentUser.phone || '';
        document.getElementById('email').value = currentUser.email || '';
        document.getElementById('address').value = currentUser.address || '';
        document.getElementById('contact_time').value = currentUser.contact_time || '';
    }

    useProfileCheckbox.addEventListener('change', () => {
        if (useProfileCheckbox.checked) {
            if (currentUser) fillFromProfile();
            else {
                alert('Сначала войдите в аккаунт');
                useProfileCheckbox.checked = false;
            }
        }
    });

    async function updateCartCount() {
        try {
            const resp = await fetch('/api/cart');
            const data = await resp.json();
            const totalItems = data.items.reduce((sum, item) => sum + (item.quantity || 1), 0);
            if (cartCountSpan) cartCountSpan.textContent = totalItems;
            return data;
        } catch(e) { console.error(e); return { items: [], total: 0 }; }
    }

    async function updateItemQuantity(itemId, newQuantity) {
        try {
            const resp = await fetch(`/api/cart/update/${itemId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ quantity: newQuantity })
            });
            if (!resp.ok) throw new Error('Update failed');
            await renderCart();
        } catch(e) {
            console.error(e);
            alert('Не удалось изменить количество');
        }
    }

    // ===== Рендер карточки обычного товара / топпера =====
    function renderProductItem(item) {
        const isTopper = item.type === 'topper' && item.extra_data;
        const productLink = item.product_code && item.product_code !== 'TOPPER'
            ? `/product/${encodeURIComponent(item.product_code)}`
            : null;

        const titleHtml = productLink
            ? `<strong><a href="${productLink}">${escapeHtml(item.product_name)}</a></strong>`
            : `<strong>${escapeHtml(item.product_name)}</strong>`;

        let extraHtml = '';
        if (isTopper) {
            const ed = item.extra_data;
            const layerNames = (ed.layer_names || []).map(escapeHtml).join(', ') || '—';
            extraHtml = `
                <div class="mattress-info" style="margin-top:10px;">
                    <div class="mattress-info-row"><span class="lbl">Размер:</span><span>${escapeHtml(ed.size_name || '—')}</span></div>
                    <div class="mattress-info-row"><span class="lbl">Слои:</span><span>${layerNames}</span></div>
                    <div class="mattress-info-row"><span class="lbl">Чехол:</span><span>${escapeHtml(ed.cover_name || '—')}</span></div>
                </div>
            `;
        }

        const materialHtml = item.material_name
            ? `Материал: ${escapeHtml(item.material_name)} (${escapeHtml(item.material_code)})<br>`
            : '';

        return `
            <div class="cart-item" data-id="${item.id}">
                <div class="item-info">
                    ${titleHtml}<br>
                    Код товара: ${escapeHtml(item.product_code)}<br>
                    ${materialHtml}
                    Цена: ${item.cost} ₽<br>
                    Количество:
                    <div class="quantity-controls">
                        <button type="button" class="qty-minus" data-id="${item.id}">-</button>
                        <input type="number" class="qty-input" data-id="${item.id}" value="${item.quantity || 1}" min="1" style="width: 60px;">
                        <button type="button" class="qty-plus" data-id="${item.id}">+</button>
                    </div>
                    ${extraHtml}
                </div>
                <button type="button" class="remove-item" data-id="${item.id}">Удалить</button>
            </div>
        `;
    }

    // ===== Рендер карточки матраса =====
    function renderMattressItem(item) {
        const ed = item.extra_data || {};
        const layerNames = ed.layer_names || [];
        const layerPrices = ed.layer_prices || [];

        const layersHtml = layerNames.length
            ? layerNames.map((name, i) => {
                const price = layerPrices[i] || 0;
                return `<div class="mattress-layer-row"><span>${escapeHtml(name)}</span><span>${price} ₽</span></div>`;
            }).join('')
            : '<div class="mattress-layer-row"><span>Слои не указаны</span><span></span></div>';

        const initialHeightText = ed.is_new
            ? 'новый матрас (0 см)'
            : `${ed.initial_height || 0} см`;

        const coverLine = `${escapeHtml(ed.cover_name || '—')} — ${ed.cover_price || 0} ₽`;

        return `
            <div class="cart-item mattress-item" data-id="${item.id}">
                <div class="item-info">
                    <strong>🛏️ ${escapeHtml(item.product_name)}</strong>
                    <div class="mattress-info">
                        <div class="mattress-info-row"><span class="lbl">Размер:</span><span>${escapeHtml(ed.size_name || '—')}</span></div>
                        <div class="mattress-info-row"><span class="lbl">Высота основы:</span><span>${initialHeightText}</span></div>
                        <div class="mattress-info-row"><span class="lbl">Чехол:</span><span>${coverLine}</span></div>
                        <div class="mattress-info-row"><span class="lbl">Слои (${layerNames.length}):</span></div>
                        <div class="mattress-layers">${layersHtml}</div>
                        <div class="mattress-info-row"><span class="lbl">Итоговая высота:</span><span>${ed.total_height || 0} см</span></div>
                    </div>
                    <div class="item-price-row">Стоимость: <strong>${item.cost} ₽</strong></div>
                    <div class="quantity-controls">
                        <button type="button" class="qty-minus" data-id="${item.id}">-</button>
                        <input type="number" class="qty-input" data-id="${item.id}" value="${item.quantity || 1}" min="1" style="width: 60px;">
                        <button type="button" class="qty-plus" data-id="${item.id}">+</button>
                    </div>
                </div>
                <button type="button" class="remove-item" data-id="${item.id}">Удалить</button>
            </div>
        `;
    }

    // ===== Основной рендер корзины с двумя разделами =====
    async function renderCart() {
        const data = await updateCartCount();
        const items = data.items || [];
        const total = data.total || 0;

        if (!items.length) {
            cartContentDiv.innerHTML = '<p>Ваша корзина пуста. Перейдите в <a href="/catalog">каталог</a> или соберите <a href="/mattress">матрас</a>.</p>';
            cartTotalDiv.innerHTML = '';
            orderFormDiv.style.display = 'none';
            return;
        }

        const productItems = items.filter(i => i.type !== 'mattress');
        const mattressItems = items.filter(i => i.type === 'mattress');

        let html = '';

        // Раздел 1: товары и топперы
        if (productItems.length) {
            html += `
                <section class="cart-section">
                    <h2 class="cart-section-title">
                        <span>Товары и топперы</span>
                        <span class="section-count">${productItems.length} поз.</span>
                    </h2>
                    <div class="cart-items-list">
                        ${productItems.map(renderProductItem).join('')}
                    </div>
                </section>
            `;
        }

        // Раздел 2: матрасы
        if (mattressItems.length) {
            html += `
                <section class="cart-section">
                    <h2 class="cart-section-title">
                        <span>Матрасы</span>
                        <span class="section-count">${mattressItems.length} поз.</span>
                    </h2>
                    <div class="cart-items-list">
                        ${mattressItems.map(renderMattressItem).join('')}
                    </div>
                </section>
            `;
        }

        cartContentDiv.innerHTML = html;
        cartTotalDiv.innerHTML = `<strong>Итого: ${total} ₽</strong>`;
        orderFormDiv.style.display = 'block';

        // Обработчики количества
        cartContentDiv.querySelectorAll('.qty-minus').forEach(btn => {
            btn.addEventListener('click', async () => {
                const id = btn.dataset.id;
                const input = cartContentDiv.querySelector(`.qty-input[data-id="${id}"]`);
                let val = parseInt(input.value, 10) || 1;
                if (val > 1) await updateItemQuantity(id, val - 1);
            });
        });
        cartContentDiv.querySelectorAll('.qty-plus').forEach(btn => {
            btn.addEventListener('click', async () => {
                const id = btn.dataset.id;
                const input = cartContentDiv.querySelector(`.qty-input[data-id="${id}"]`);
                let val = parseInt(input.value, 10) || 1;
                await updateItemQuantity(id, val + 1);
            });
        });
        cartContentDiv.querySelectorAll('.qty-input').forEach(input => {
            input.addEventListener('change', async () => {
                const id = input.dataset.id;
                let val = parseInt(input.value, 10);
                if (isNaN(val) || val < 1) val = 1;
                await updateItemQuantity(id, val);
            });
        });
        cartContentDiv.querySelectorAll('.remove-item').forEach(btn => {
            btn.addEventListener('click', async () => {
                const id = btn.dataset.id;
                await fetch(`/api/cart/remove/${id}`, { method: 'DELETE' });
                renderCart();
            });
        });
    }

    // ===== Оформление заказа =====
    document.getElementById('order-form-fields').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = {
            user_name: document.getElementById('user_name').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            email: document.getElementById('email').value.trim(),
            address: document.getElementById('address').value.trim(),
            comment: document.getElementById('comment').value.trim(),
            contact_time: document.getElementById('contact_time').value.trim()
        };
        if (!formData.user_name || !formData.phone) {
            alert('Пожалуйста, заполните ФИО и номер телефона');
            return;
        }
        try {
            const resp = await fetch('/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });
            const result = await resp.json();
            if (result.success) {
                const ids = [];
                if (result.order_id) ids.push(`№${result.order_id} (товары)`);
                if (Array.isArray(result.mattress_order_ids)) {
                    result.mattress_order_ids.forEach(id => ids.push(`№${id} (матрас)`));
                }
                let msg = 'Заказ успешно оформлен!';
                if (ids.length) msg += '\nНомера заказов: ' + ids.join(', ');
                alert(msg);
                window.location.href = '/';
            } else {
                alert('Ошибка: ' + (result.error || 'неизвестная ошибка'));
            }
        } catch (err) {
            console.error(err);
            alert('Не удалось оформить заказ');
        }
    });

    fetchCurrentUser();
    renderCart();
    setInterval(() => { fetchCurrentUser(); renderCart(); }, 5000);
</script>
</body>
</html>
