<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Корзина | LUTOhayse</title>
    <link rel="icon" type="image/png" href="/media/interface/favicon.png">
    <link rel="stylesheet" href="/cart.css">

</head>
<body>

<!-- Значок профиля -->
<div class="profile-icon-wrapper" id="profileIcon">
    <a href="/profile" class="profile-fixed-link">
        <img src="/media/interface/profile_icon.svg" alt="Профиль">
    </a>
</div>

<!-- Значок корзины -->
<div class="cart-icon-wrapper">
    <a href="/cart" class="cart-fixed-link">
        <img src="/media/interface/cart_icon.svg" alt="Корзина">
        <span id="cart-count" class="cart-count-badge">0</span>
    </a>
</div>

<header>
    <section class="main__header">
        <div class="header__container">
            <div class="menu__body">
                <nav class="menu__body menu__body-main">
                    <ul class="menu__list">
                        <li class="menu__item site-logo">
                            <h1 class="logo">
                                <a href="/" class="menu__link logo-link">LUTO<span class="logo-sub">hayse</span></a>
                            </h1>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </section>
</header>

<main class="cart-container">
    <h1>Корзина</h1>
    <div id="cart-items"></div>
    <div id="cart-total" class="cart-total"></div>
    <div id="order-form" class="order-form" style="display: none;">
        <h2>Оформление заказа</h2>
        <div id="profileCheckboxDiv" style="margin-bottom: 20px;">
            <label style="cursor: pointer;">
                <input type="checkbox" id="useProfileCheckbox"> Заполнить из профиля
            </label>
            <span id="profileStatus" style="margin-left: 15px; font-size: 14px;"></span>
        </div>
        <form id="order-form-fields">
            <div class="form-group">
                <label>ФИО *</label>
                <input type="text" id="user_name" required>
            </div>
            <div class="form-group">
                <label>Телефон *</label>
                <input type="tel" id="phone" required>
            </div>
            <div class="form-group">
                <label>Электронная почта</label>
                <input type="email" id="email">
            </div>
            <div class="form-group">
                <label>Адрес доставки</label>
                <textarea id="address" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label>Комментарий к заказу</label>
                <textarea id="comment" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Удобное время для связи</label>
                <input type="text" id="contact_time" placeholder="например: с 10 до 18">
            </div>
            <button type="submit" class="submit-order">Оформить заказ</button>
        </form>
    </div>
</main>

<footer>
    <div class="footer-top">
        <div class="footer-left">
            <div class="logo">LUTO<span class="logo-sub">hayse</span></div>
            <div class="phone-label">Звонок по России бесплатный</div>
            <div class="phone-number">8 (999) 700-05-50</div>
            <div style="margin-top: 8px; font-size: 14px; color: #555;">
                Email: <a href="mailto:luto.house@mail.ru" style="color: #628b35; text-decoration: none;">luto.house@mail.ru</a>
            </div>
            <div style="margin-top: 12px;">
                <a href="https://vk.ru/lutohay" target="_blank" style="text-decoration: none; color: #628b35; font-weight: 500;">
                    <img src="/media/interface/vk_icon.svg" alt="ВКонтакте" style="width: 32px; height: 32px; vertical-align: middle; margin-right: 6px;">
                    ВКонтакте
                </a>
            </div>
        </div>
    </div>
    <div class="footer-bottom"><div class="copyright">© Интернет магазин LUTOhayse мебель от производителя</div></div>
</footer>

<script>
    const cartCountSpan = document.getElementById('cart-count');
    const cartItemsDiv = document.getElementById('cart-items');
    const cartTotalDiv = document.getElementById('cart-total');
    const orderFormDiv = document.getElementById('order-form');
    const useProfileCheckbox = document.getElementById('useProfileCheckbox');
    const profileStatusSpan = document.getElementById('profileStatus');
    const profileIcon = document.getElementById('profileIcon');

    let currentUser = null;

    async function fetchCurrentUser() {
        try {
            const resp = await fetch('/api/auth/me');
            const data = await resp.json();
            if (data.authenticated) {
                currentUser = data.user;
                profileStatusSpan.innerHTML = `Вы вошли как ${currentUser.phone} <a href="/profile">(профиль)</a>`;
                if (profileIcon) profileIcon.style.background = '#628b35';
                if (useProfileCheckbox.checked) fillFromProfile();
            } else {
                currentUser = null;
                profileStatusSpan.innerHTML = 'Не авторизованы. <a href="/login">Войдите</a> чтобы использовать профиль.';
                if (profileIcon) profileIcon.style.background = '#e3342f';
            }
        } catch(e) { console.error(e); }
    }

    function fillFromProfile() {
        if (!currentUser) {
            alert('Вы не авторизованы. Войдите в аккаунт.');
            useProfileCheckbox.checked = false;
            return;
        }
        document.getElementById('user_name').value = currentUser.full_name || '';
        document.getElementById('phone').value = currentUser.phone || '';
        document.getElementById('email').value = currentUser.email || '';
        document.getElementById('address').value = currentUser.address || '';
        document.getElementById('contact_time').value = currentUser.contact_time || '';
    }

    useProfileCheckbox.addEventListener('change', () => {
        if (useProfileCheckbox.checked) {
            if (currentUser) fillFromProfile();
            else {
                alert('Сначала войдите в аккаунт');
                useProfileCheckbox.checked = false;
            }
        }
    });

    async function updateCartCount() {
        try {
            const resp = await fetch('/api/cart');
            const data = await resp.json();
            const totalItems = data.items.reduce((sum, item) => sum + (item.quantity || 1), 0);
            if (cartCountSpan) cartCountSpan.textContent = totalItems;
            return data;
        } catch(e) { console.error(e); return { items: [], total: 0 }; }
    }

    async function updateItemQuantity(itemId, newQuantity) {
        try {
            const resp = await fetch(`/api/cart/update/${itemId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ quantity: newQuantity })
            });
            if (!resp.ok) throw new Error('Update failed');
            await renderCart();
        } catch(e) {
            console.error(e);
            alert('Не удалось изменить количество');
        }
    }

    async function renderCart() {
        const data = await updateCartCount();
        const items = data.items;
        const total = data.total;
        if (!items.length) {
            cartItemsDiv.innerHTML = '<p>Ваша корзина пуста. Перейдите в <a href="/catalog">каталог</a>.</p>';
            cartTotalDiv.innerHTML = '';
            orderFormDiv.style.display = 'none';
            return;
        }
        let html = '<div class="cart-items-list">';
        items.forEach(item => {
            const productLink = `/product/${encodeURIComponent(item.product_code)}`;
            html += `
                <div class="cart-item" data-id="${item.id}">
                    <div class="item-info">
                        <strong><a href="${productLink}" style="color: #628b35; text-decoration: none;">${escapeHtml(item.product_name)}</a></strong><br>
                        Код товара: ${escapeHtml(item.product_code)}<br>
                        Материал: ${escapeHtml(item.material_name)} (${escapeHtml(item.material_code)})<br>
                        Цена: ${item.cost} ₽<br>
                        Количество:
                        <div class="quantity-controls">
                            <button class="qty-minus" data-id="${item.id}">-</button>
                            <input type="number" class="qty-input" data-id="${item.id}" value="${item.quantity || 1}" min="1" style="width: 60px; text-align: center;">
                            <button class="qty-plus" data-id="${item.id}">+</button>
                        </div>
                    </div>
                    <button class="remove-item" data-id="${item.id}">Удалить</button>
                </div>
            `;
        });
        html += '</div>';
        cartItemsDiv.innerHTML = html;
        cartTotalDiv.innerHTML = `<strong>Итого: ${total} ₽</strong>`;
        orderFormDiv.style.display = 'block';

        document.querySelectorAll('.qty-minus').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const id = btn.dataset.id;
                const input = document.querySelector(`.qty-input[data-id="${id}"]`);
                let val = parseInt(input.value, 10) || 1;
                if (val > 1) await updateItemQuantity(id, val - 1);
            });
        });
        document.querySelectorAll('.qty-plus').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const id = btn.dataset.id;
                const input = document.querySelector(`.qty-input[data-id="${id}"]`);
                let val = parseInt(input.value, 10) || 1;
                await updateItemQuantity(id, val + 1);
            });
        });
        document.querySelectorAll('.qty-input').forEach(input => {
            input.addEventListener('change', async (e) => {
                const id = input.dataset.id;
                let val = parseInt(input.value, 10);
                if (isNaN(val) || val < 1) val = 1;
                await updateItemQuantity(id, val);
            });
        });
        document.querySelectorAll('.remove-item').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const id = btn.dataset.id;
                await fetch(`/api/cart/remove/${id}`, { method: 'DELETE' });
                renderCart();
            });
        });
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    document.getElementById('order-form-fields').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = {
            user_name: document.getElementById('user_name').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            email: document.getElementById('email').value.trim(),
            address: document.getElementById('address').value.trim(),
            comment: document.getElementById('comment').value.trim(),
            contact_time: document.getElementById('contact_time').value.trim()
        };
        if (!formData.user_name || !formData.phone) {
            alert('Пожалуйста, заполните ФИО и номер телефона');
            return;
        }
        try {
            const resp = await fetch('/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });
            const result = await resp.json();
            if (result.success) {
                alert('Заказ успешно оформлен! Номер заказа: ' + result.order_id);
                window.location.href = '/';
            } else {
                alert('Ошибка: ' + (result.error || 'неизвестная ошибка'));
            }
        } catch (err) {
            console.error(err);
            alert('Не удалось оформить заказ');
        }
    });

    fetchCurrentUser();
    renderCart();
    setInterval(() => { fetchCurrentUser(); renderCart(); }, 5000);
</script>
</body>
</html>
