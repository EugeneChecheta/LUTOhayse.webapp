<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/png" href="/media/interface/favicon.png">
    <title>Каталог | LUTOhayse</title>
    <link rel="stylesheet" href="/catalog.css">

<body>

<!-- Значок профиля -->
<div class="profile-icon-wrapper" id="profileIcon">
    <a href="/profile" class="profile-fixed-link">
        <img src="/media/interface/profile_icon.svg" alt="Профиль">
    </a>
</div>

<!-- Фиксированная корзина в правом верхнем углу -->
<div class="cart-icon-wrapper">
    <a href="/cart" class="cart-fixed-link">
        <img src="/media/interface/cart_icon.svg" alt="Корзина">
        <span id="cart-count" class="cart-count-badge">0</span>
    </a>
</div>

<header>
    <section class="main__header">
        <div class="header__container">
            <div class="menu__body">
                <nav class="menu__body menu__body-main">
                    <ul class="menu__list">
                        <li class="menu__item site-logo">
                            <h1 class="logo">
                                <a href="/" class="menu__link logo-link">LUTO<span class="logo-sub">hayse</span></a>
                            </h1>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </section>
</header>

<main class="goods">
    <h1 class="header">Каталог мебели</h1>

    <div class="filters">
        <div class="filter-group">
            <label for="type-select">Тип товара:</label>
            <select id="type-select">
                <option value="">Все типы</option>
            </select>
        </div>
        <div class="filter-group flags-group">
            <span class="flags-label">Флаги:</span>
            <div id="flags-checkboxes" class="flags-checkboxes"></div>
        </div>
    </div>

    <div id="catalog-loader" class="loader">Загрузка товаров...</div>
    <div id="catalog-grid" class="slider-containers" style="display: none;"></div>
    <div id="catalog-error" class="error-message" style="display: none;">Не удалось загрузить товары. Попробуйте позже.</div>
    <div id="load-more-btn" class="load-more-btn" style="display: none;">Показать ещё</div>
    <div id="loader-more" class="loader-more" style="display: none;">Загрузка...</div>
</main>

<footer>
    <div class="footer-top">
        <div class="footer-left">
            <div class="logo">LUTO<span class="logo-sub">hayse</span></div>
            <div class="phone-label">Звонок по России бесплатный</div>
            <div class="phone-number">8 (999) 700-05-50</div>
            <div style="margin-top: 8px; font-size: 14px; color: #555;">
                Email: <a href="mailto:luto.house@mail.ru" style="color: #628b35; text-decoration: none;">luto.house@mail.ru</a>
            </div>
            <div style="margin-top: 12px;">
                <a href="https://vk.ru/lutohay" target="_blank" style="text-decoration: none; color: #628b35; font-weight: 500;">
                    <img src="/media/interface/vk_icon.svg" alt="ВКонтакте" style="width: 32px; height: 32px; vertical-align: middle; margin-right: 6px;">
                    ВКонтакте
                </a>
            </div>
        </div>
    </div>
    <div class="footer-bottom"><div class="copyright">© Интернет магазин LUTOhayse мебель от производителя</div></div>
</footer>

<script>
    const gridContainer = document.getElementById('catalog-grid');
    const loader = document.getElementById('catalog-loader');
    const errorBlock = document.getElementById('catalog-error');
    const typeSelect = document.getElementById('type-select');
    const flagsContainer = document.getElementById('flags-checkboxes');
    const cartCountSpan = document.getElementById('cart-count');
    const loadMoreBtn = document.getElementById('load-more-btn');
    const loaderMore = document.getElementById('loader-more');
    const profileIcon = document.getElementById('profileIcon');

    let currentPage = 1;
    let totalProducts = 0;
    let loading = false;
    let currentFilters = { typeId: '', flagIds: [] };
    let productsLoaded = []; // все загруженные товары

    // ===== ЕДИНАЯ ФУНКЦИЯ ДЛЯ СОЗДАНИЯ КАРТОЧКИ ТОВАРА =====
    function createProductCardHTML(prod) {
        const codeEnc = encodeURIComponent(prod.code);
        const img1 = `/media/products/${codeEnc}/1.webp`;
        const img2 = `/media/products/${codeEnc}/preview.webp`;
        const priceHtml = (prod.min_cost !== null && prod.min_cost !== undefined)
            ? `<div class="product-price">от ${prod.min_cost} ₽</div>`
            : `<div class="product-price">Цена по запросу</div>`;
        return `
            <a href="/product/${codeEnc}" class="slider-items">
                <div class="image-wrapper">
                    <img src="${img1}" alt="${escapeHtml(prod.name)}" loading="lazy"
                         onerror="if(this.src==='${img1}'){this.src='${img2}';}else{this.src='/media/interface/placeholder.png';}">
                </div>
                <div class="product-name">${escapeHtml(prod.name)}</div>
                <div class="code-name">Код: ${escapeHtml(prod.code)}</div>
                ${priceHtml}
            </a>
        `;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function updateCartCount() {
        try {
            const resp = await fetch('/api/cart');
            const data = await resp.json();
            const totalItems = data.items.reduce((sum, item) => sum + (item.quantity || 1), 0);
            if (cartCountSpan) cartCountSpan.textContent = totalItems;
        } catch(e) { console.error(e); }
    }

    function renderProducts(products, append = false) {
        if (!append) {
            gridContainer.innerHTML = '';
            productsLoaded = [];
        }
        if (!products.length) {
            if (!append) {
                gridContainer.innerHTML = '<p class="empty">Товаров не найдено</p>';
                gridContainer.style.display = 'grid';
            }
            return;
        }
        let html = '';
        for (const prod of products) {
            html += createProductCardHTML(prod);
        }
        if (append) {
            gridContainer.insertAdjacentHTML('beforeend', html);
        } else {
            gridContainer.innerHTML = html;
        }
        productsLoaded = productsLoaded.concat(products);
        gridContainer.style.display = 'grid';
    }

    async function loadProducts(page = 1, append = false) {
        if (loading) return;
        loading = true;
        loadMoreBtn.style.display = 'none';
        loaderMore.style.display = 'block';
        if (!append) {
            loader.style.display = 'block';
            gridContainer.style.display = 'none';
            errorBlock.style.display = 'none';
        }

        const typeId = typeSelect.value;
        const selectedFlags = Array.from(document.querySelectorAll('.flag-checkbox:checked')).map(cb => cb.value);
        currentFilters.typeId = typeId;
        currentFilters.flagIds = selectedFlags;

        let url = '/api/products?';
        const params = new URLSearchParams();
        if (typeId) params.append('type_id', typeId);
        selectedFlags.forEach(fid => params.append('flag_ids', fid));
        params.append('page', page);
        params.append('limit', 12);
        url += params.toString();

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            const products = data.items || [];
            totalProducts = data.total || 0;
            renderProducts(products, append);
            currentPage = page;
            if (currentPage * 12 < totalProducts) {
                loadMoreBtn.style.display = 'block';
            } else {
                loadMoreBtn.style.display = 'none';
            }
        } catch (err) {
            console.error(err);
            if (!append) {
                loader.style.display = 'none';
                errorBlock.style.display = 'block';
            } else {
                alert('Не удалось загрузить следующую страницу');
            }
        } finally {
            loader.style.display = 'none';
            loaderMore.style.display = 'none';
            loading = false;
        }
    }

    async function loadFilters() {
        try {
            const typesResp = await fetch('/api/types');
            if (typesResp.ok) {
                const types = await typesResp.json();
                typeSelect.innerHTML = '<option value="">Все типы</option>';
                types.forEach(t => {
                    const option = document.createElement('option');
                    option.value = t.id;
                    option.textContent = t.name;
                    typeSelect.appendChild(option);
                });
            }
            const flagsResp = await fetch('/api/flags');
            if (flagsResp.ok) {
                const flags = await flagsResp.json();
                flagsContainer.innerHTML = '';
                flags.forEach(f => {
                    const label = document.createElement('label');
                    label.className = 'flag-checkbox-label';
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.value = f.id;
                    cb.className = 'flag-checkbox';
                    label.appendChild(cb);
                    label.appendChild(document.createTextNode(` ${f.name}`));
                    flagsContainer.appendChild(label);
                });
            }
            // Загружаем первую страницу
            await loadProducts(1, false);
        } catch (err) {
            console.error('Ошибка загрузки фильтров:', err);
        }
    }

    function onChangeFilter() {
        // сброс пагинации при изменении фильтров
        loadProducts(1, false);
    }

    typeSelect.addEventListener('change', onChangeFilter);
    flagsContainer.addEventListener('change', (e) => {
        if (e.target.classList.contains('flag-checkbox')) onChangeFilter();
    });

    loadMoreBtn.addEventListener('click', () => {
        loadProducts(currentPage + 1, true);
    });

    // Обновление цвета профиля
    async function updateProfileIcon() {
        try {
            const resp = await fetch('/api/auth/me');
            const data = await resp.json();
            if (profileIcon) {
                if (data.authenticated) {
                    profileIcon.style.background = '#628b35';
                } else {
                    profileIcon.style.background = '#e3342f';
                }
            }
        } catch(e) { console.error(e); }
    }

    loadFilters();
    updateCartCount();
    updateProfileIcon();
    setInterval(updateCartCount, 5000);
</script>
</body>
</html>
