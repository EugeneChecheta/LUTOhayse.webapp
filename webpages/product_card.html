</head>
<body>

    <!-- Значок профиля -->
    <div class="profile-icon-wrapper" id="profileIcon">
        <a href="/profile" class="profile-fixed-link">
            <img src="/media/interface/profile_icon.svg" alt="Профиль">
        </a>
    </div>

    <!-- Фиксированная корзина -->
    <div class="cart-icon-wrapper">
        <a href="/cart" class="cart-fixed-link">
            <img src="/media/interface/cart_icon.svg" alt="Корзина">
            <span id="cart-count" class="cart-count-badge">0</span>
        </a>
    </div>

    <header>
        <section class="main__header">
            <div class="header__container">
                <div class="menu__body">
                    <nav class="menu__body menu__body-main">
                        <ul class="menu__list">
                            <li class="menu__item site-logo">
                                <h1 class="logo">
                                    <a href="/" class="menu__link logo-link">LUTO<span class="logo-sub">hayse</span></a>
                                </h1>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </section>
    </header>

    <main class="page-container two-col-layout" id="productRoot">
        <!-- Панель товара -->
        <aside class="product-panel">
            <h1 class="product-title" id="productTitle">Загрузка...</h1>
            <div class="price-block">
                <div class="price-current" id="priceCurrent">--- <sup>₽</sup></div>
            </div>
            <div class="selected-material" id="selectedMaterialBlock">
                <span id="selectedMaterialText">Материал не выбран</span>
                <button id="chooseMaterialBtn" class="choose-material-btn">Выбрать материал</button>
            </div>
            <div class="btn-cart-container" id="addToCartContainer" style="display: none;">
                <button id="btnAddToCart" class="btn-cart">Добавить в корзину</button>
            </div>
        </aside>

        <!-- Галерея -->
        <section class="right-gallery desktop-gallery" id="gallerySection">
            <div class="gallery-wrapper" id="slider"></div>
            <div class="slider-dots" id="sliderDots"></div>
        </section>

        <!-- Схема и характеристики -->
        <div class="size-schema-block">
            <img id="sizeImage" class="dimensions-img" src="" alt="Схема размеров">
            <div id="featuresContainer"></div>
        </div>
    </main>

    <!-- Модальное окно выбора материалов -->
    <div id="materialModal" class="modal material-modal">
        <div class="modal-content material-modal-content">
            <span class="close-modal">&times;</span>
            <h2>Выберите материал</h2>
            <div class="tabs" id="materialTabs"></div>
            <div id="materialsList" class="materials-container"></div>
        </div>
    </div>

    <!-- Модальное окно для зума -->
    <div id="zoomModal" class="zoom-modal">
        <span class="zoom-close">&times;</span>
        <button class="zoom-nav zoom-prev" id="zoomPrev" type="button" aria-label="Предыдущее фото">&#10094;</button>
        <img class="zoom-modal-content" id="zoomImage" src="" alt="Увеличенное изображение">
        <button class="zoom-nav zoom-next" id="zoomNext" type="button" aria-label="Следующее фото">&#10095;</button>
        <div class="zoom-counter">
            <span id="zoomCounterCurrent">1</span> / <span id="zoomCounterTotal">1</span>
        </div>
    </div>

    <footer>
        <div class="footer-top">
            <div class="footer-left">
                <div class="logo">LUTO<span class="logo-sub">hayse</span></div>
                <div class="phone-label">Звонок по России бесплатный</div>
                <div class="phone-number">8 (999) 700-05-50</div>
                <div style="margin-top: 8px; font-size: 14px; color: #555;">
                    Email: <a href="mailto:luto.house@mail.ru" style="color: #628b35; text-decoration: none;">luto.house@mail.ru</a>
                </div>
                <div style="margin-top: 12px;">
                    <a href="https://vk.ru/lutohay" target="_blank" style="text-decoration: none; color: #628b35; font-weight: 500;">
                        <img src="/media/interface/vk_icon.svg" alt="ВКонтакте" style="width: 32px; height: 32px; vertical-align: middle; margin-right: 6px;">
                        ВКонтакте
                    </a>
                </div>
            </div>
        </div>
        <div class="footer-bottom"><div class="copyright">© Интернет магазин LUTOhayse мебель от производителя</div></div>
    </footer>

    <script>
        let productData = null;
        let selectedMaterial = null;
        let minCost = null;
        const productCode = window.location.pathname.split('/').pop();
        const cartCountSpan = document.getElementById('cart-count');
        const profileIcon = document.getElementById('profileIcon');

        // ---- Зум ----
        const zoomModal = document.getElementById('zoomModal');
        const zoomImage = document.getElementById('zoomImage');
        const zoomClose = document.querySelector('.zoom-close');
        const zoomPrevBtn = document.getElementById('zoomPrev');
        const zoomNextBtn = document.getElementById('zoomNext');
        const zoomCounterCurrent = document.getElementById('zoomCounterCurrent');
        const zoomCounterTotal = document.getElementById('zoomCounterTotal');

        let zoomImages = [];
        let zoomIndex = 0;

        function getGalleryImageSrcs() {
            return Array.from(document.querySelectorAll('#slider .slide img'))
                .map(img => img.src)
                .filter(Boolean);
        }

        function openZoom(src) {
            const galleryImgs = getGalleryImageSrcs();
            // Ищем соответствие либо по полному URL, либо по окончанию пути
            let idx = galleryImgs.findIndex(g => g === src || g.endsWith(src) || src.endsWith(g));
            if (idx !== -1) {
                zoomImages = galleryImgs;
                zoomIndex = idx;
            } else {
                zoomImages = [src];
                zoomIndex = 0;
            }
            renderZoomImage();
            zoomModal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function renderZoomImage() {
            if (!zoomImages.length) return;
            zoomImage.src = zoomImages[zoomIndex];
            const total = zoomImages.length;
            const showNav = total > 1;
            zoomPrevBtn.style.display = showNav ? 'flex' : 'none';
            zoomNextBtn.style.display = showNav ? 'flex' : 'none';
            const counter = document.querySelector('.zoom-counter');
            if (counter) counter.style.display = showNav ? 'block' : 'none';
            if (zoomCounterCurrent) zoomCounterCurrent.textContent = zoomIndex + 1;
            if (zoomCounterTotal) zoomCounterTotal.textContent = total;
        }

        function showNextZoomImage() {
            if (zoomImages.length < 2) return;
            zoomIndex = (zoomIndex + 1) % zoomImages.length;
            renderZoomImage();
        }

        function showPrevZoomImage() {
            if (zoomImages.length < 2) return;
            zoomIndex = (zoomIndex - 1 + zoomImages.length) % zoomImages.length;
            renderZoomImage();
        }

        function closeZoom() {
            zoomModal.style.display = 'none';
            document.body.style.overflow = '';
            zoomImage.src = '';
            zoomImages = [];
            zoomIndex = 0;
        }

        zoomClose.addEventListener('click', closeZoom);
        zoomPrevBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            showPrevZoomImage();
        });
        zoomNextBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            showNextZoomImage();
        });
        zoomModal.addEventListener('click', function(e) {
            if (e.target === zoomModal) closeZoom();
        });

        // Клавиатура: стрелки + Escape
        document.addEventListener('keydown', function(e) {
            if (zoomModal.style.display !== 'flex') return;
            if (e.key === 'Escape') closeZoom();
            else if (e.key === 'ArrowRight') showNextZoomImage();
            else if (e.key === 'ArrowLeft') showPrevZoomImage();
        });

        // Свайп на мобильных в зум-модалке
        let zoomTouchStartX = 0;
        let zoomTouchStartY = 0;
        let zoomTouchMoved = false;

        zoomModal.addEventListener('touchstart', function(e) {
            if (e.touches.length !== 1) return;
            zoomTouchStartX = e.touches[0].clientX;
            zoomTouchStartY = e.touches[0].clientY;
            zoomTouchMoved = false;
        }, { passive: true });

        zoomModal.addEventListener('touchmove', function(e) {
            if (e.touches.length !== 1) return;
            const dx = e.touches[0].clientX - zoomTouchStartX;
            const dy = e.touches[0].clientY - zoomTouchStartY;
            if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
                zoomTouchMoved = true;
            }
        }, { passive: true });

        zoomModal.addEventListener('touchend', function(e) {
            if (e.changedTouches.length !== 1) return;
            const dx = e.changedTouches[0].clientX - zoomTouchStartX;
            const dy = e.changedTouches[0].clientY - zoomTouchStartY;
            if (!zoomTouchMoved) return;
            // Только горизонтальный свайп
            if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
                if (dx < 0) showNextZoomImage();
                else showPrevZoomImage();
            }
        }, { passive: true });

        // ---- Корзина ----
        async function updateCartCount() {
            try {
                const resp = await fetch('/api/cart');
                const data = await resp.json();
                const totalItems = data.items.reduce((sum, item) => sum + (item.quantity || 1), 0);
                if (cartCountSpan) cartCountSpan.textContent = totalItems;
            } catch (e) { console.error(e); }
        }

        // ---- Загрузка товара ----
        async function loadProduct(code) {
            try {
                const resp = await fetch(`/api/product/${code}`);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                productData = await resp.json();
                renderProduct(productData);
            } catch (err) {
                console.error(err);
                document.getElementById('productTitle').innerText = 'Ошибка загрузки товара';
            }
        }

        function renderProduct(data) {
            const product = data.product;
            const costs = data.costs || [];
            const minCostFromApi = data.min_cost;
            const mainFeatures = data.main_features || [];
            const extraFeatures = data.extra_features || [];
            const photos = data.photos || { preview: null, size: null, main: [] };

            document.getElementById('productTitle').innerText = product.name;
            minCost = minCostFromApi;
            if (minCost !== null && minCost !== undefined) {
                document.getElementById('priceCurrent').innerHTML = `от ${minCost} <sup>₽</sup>`;
            } else {
                document.getElementById('priceCurrent').innerHTML = 'Цена по запросу';
            }

            // Схема
            const sizeImg = document.getElementById('sizeImage');
            if (photos.size) {
                sizeImg.src = photos.size;
                sizeImg.style.display = 'block';
                sizeImg.onclick = function() {
                    openZoom(sizeImg.src);
                };
            } else {
                sizeImg.style.display = 'none';
            }

            // Характеристики
            const featuresContainer = document.getElementById('featuresContainer');
            featuresContainer.innerHTML = '';

            if (mainFeatures.length) {
                const mainTitle = document.createElement('h3');
                mainTitle.textContent = 'Основные характеристики';
                mainTitle.className = 'features-title';
                featuresContainer.appendChild(mainTitle);
                const mainTable = createFeatureTable(mainFeatures);
                featuresContainer.appendChild(mainTable);
            }

            if (extraFeatures.length) {
                const extraTitle = document.createElement('h3');
                extraTitle.textContent = 'Дополнительные характеристики';
                extraTitle.className = 'features-title';
                featuresContainer.appendChild(extraTitle);
                const extraTable = createFeatureTable(extraFeatures, true);
                featuresContainer.appendChild(extraTable);
            }

            appendStaticFeatures(featuresContainer);

            // Галерея (слайдер)
            const slider = document.getElementById('slider');
            slider.innerHTML = '';
            let allImages = [];
            if (photos.main.length === 0 && !photos.preview) {
                allImages = ['/media/interface/placeholder.png'];
            } else {
                if (photos.preview) allImages.push(photos.preview);
                allImages.push(...photos.main);
            }
            allImages.forEach(src => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'slide';
                const img = document.createElement('img');
                img.src = src;
                img.alt = 'Фото товара';
                img.loading = 'lazy';
                slideDiv.appendChild(img);
                slider.appendChild(slideDiv);
            });
            initSlider(allImages.length);

            // Клик по галерее – зум (делегирование)
            const gallery = document.getElementById('gallerySection');
            gallery.removeEventListener('click', galleryZoomHandler);
            gallery.addEventListener('click', galleryZoomHandler);

            window.productCosts = costs;
        }

        // Отдельная функция для обработчика клика по галерее
        function galleryZoomHandler(e) {
            const img = e.target.closest('.slide img');
            if (img) {
                openZoom(img.src);
            }
        }

        function createFeatureTable(features, isExtra = false) {
            const table = document.createElement('table');
            table.className = 'spec-table';
            const tbody = document.createElement('tbody');
            features.forEach(f => {
                const row = tbody.insertRow();
                const cellName = row.insertCell(0);
                const cellValue = row.insertCell(1);
                cellName.textContent = f.name;
                cellValue.textContent = f.value || '—';
            });
            table.appendChild(tbody);
            return table;
        }

        function appendStaticFeatures(container) {
            const staticFeatures = [
                { name: "Срок производства", value: "21 день" },
                { name: "Требуется сборка", value: "Нет" },
                { name: "Декларация до", value: "10.09.2030" },
                { name: "Декларация от", value: "11.09.2025" },
                { name: "Декларация", value: "ЕАЭС N RU Д-RU.PA08.B.13389/25" },
                { name: "Материал общий", value: "ППУ ST, Синтепон, Спанбонд, Холлофайбер, Брус сосна просушенная в\\с, березовая фанера в\\с, термовойлок" },
                { name: "Материал каркаса", value: "Сосновый брус/березовая фанера" },
                { name: "Страна производства", value: "Россия" },
                { name: "Бренд", value: "LUTOhayse" },
                { name: "Мягкость сиденья", value: "Средняя" },
                { name: "Наполнитель сиденья", value: "Пенополиуретан" },
                { name: "Наполнение подушек", value: "Крошка ППУ" },
                { name: "Тип сборки", value: "Не требует сборки, только установить фурнитуру" },
                { name: "Наличие ножек", value: "Да" },
                { name: "Наполнение", value: "ППУ" },
                { name: "Особенности", value: "Ортопедические свойства; на ножках" }
            ];
            const staticTitle = document.createElement('h3');
            staticTitle.textContent = 'Общие характеристики';
            staticTitle.className = 'features-title';
            container.appendChild(staticTitle);
            const staticTable = document.createElement('table');
            staticTable.className = 'spec-table';
            const tbody = document.createElement('tbody');
            staticFeatures.forEach(f => {
                const row = tbody.insertRow();
                const cellName = row.insertCell(0);
                const cellValue = row.insertCell(1);
                cellName.textContent = f.name;
                cellValue.textContent = f.value;
            });
            staticTable.appendChild(tbody);
            container.appendChild(staticTable);
        }

        // ---- Слайдер ----
        let currentSlide = 0;
        let totalSlides = 0;
        let sliderElement = null;
        let isDragging = false;

        function initSlider(slidesCount) {
            totalSlides = slidesCount;
            if (totalSlides <= 1) return;
            sliderElement = document.getElementById('slider');
            if (!sliderElement) return;
            sliderElement.style.display = 'flex';
            sliderElement.style.transition = 'transform 0.3s ease';
            updateSliderTransform();

            const dotsContainer = document.getElementById('sliderDots');
            dotsContainer.innerHTML = '';
            for (let i = 0; i < totalSlides; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot' + (i === 0 ? ' active' : '');
                dot.addEventListener('click', (function(idx) {
                    return function() { goToSlide(idx); };
                })(i));
                dotsContainer.appendChild(dot);
            }

            const gallery = document.getElementById('gallerySection');
            gallery.addEventListener('mousemove', (e) => {
                const rect = gallery.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const percent = Math.min(1, Math.max(0, mouseX / rect.width));
                const newIndex = Math.floor(percent * totalSlides);
                if (newIndex !== currentSlide) {
                    goToSlide(newIndex);
                }
            });

            let touchStartX = 0;
            gallery.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                isDragging = true;
            });
            gallery.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const dx = e.touches[0].clientX - touchStartX;
                if (Math.abs(dx) > 30) {
                    if (dx > 0 && currentSlide > 0) goToSlide(currentSlide - 1);
                    else if (dx < 0 && currentSlide < totalSlides - 1) goToSlide(currentSlide + 1);
                    isDragging = false;
                }
            });
            gallery.addEventListener('touchend', () => {
                isDragging = false;
            });
        }

        function goToSlide(index) {
            if (index < 0) index = 0;
            if (index >= totalSlides) index = totalSlides - 1;
            if (index === currentSlide) return;
            currentSlide = index;
            updateSliderTransform();
            updateDots();
        }

        function updateSliderTransform() {
            if (!sliderElement) return;
            const shift = -currentSlide * 100;
            sliderElement.style.transform = `translateX(${shift}%)`;
        }

        function updateDots() {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                if (i === currentSlide) dot.classList.add('active');
                else dot.classList.remove('active');
            });
        }

        // ---- Материалы ----
        const modal = document.getElementById('materialModal');
        const chooseBtn = document.getElementById('chooseMaterialBtn');
        const closeModalSpan = document.querySelector('.close-modal');
        let allMaterials = [];

        async function loadMaterials() {
            try {
                const resp = await fetch('/api/materials');
                if (!resp.ok) throw new Error('Ошибка загрузки материалов');
                allMaterials = await resp.json();
            } catch (err) {
                console.error(err);
                allMaterials = [];
            }
        }

        async function openMaterialModal() {
            if (allMaterials.length === 0) {
                await loadMaterials();
            }
            renderMaterialTabsAndGrid();
            // flex — чтобы контент центрировался по вертикали и горизонтали
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeMaterialModal() {
            modal.style.display = 'none';
            document.body.style.overflow = '';
        }

        function renderMaterialTabsAndGrid() {
            const groups = {};
            allMaterials.forEach(mat => {
                if (!groups[mat.materials_type_id]) {
                    groups[mat.materials_type_id] = {
                        type_id: mat.materials_type_id,
                        type_name: mat.type_name,
                        items: []
                    };
                }
                groups[mat.materials_type_id].items.push(mat);
            });
            const typeIds = Object.keys(groups).map(Number);
            const tabsContainer = document.getElementById('materialTabs');
            tabsContainer.innerHTML = '';
            typeIds.forEach((typeId, idx) => {
                const tab = document.createElement('div');
                tab.className = 'tab' + (idx === 0 ? ' active' : '');
                tab.dataset.type = typeId;
                tab.textContent = groups[typeId].type_name;
                tab.addEventListener('click', () => {
                    document.querySelectorAll('#materialTabs .tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    renderMaterialGrid(groups[typeId].items);
                });
                tabsContainer.appendChild(tab);
            });
            if (typeIds.length) {
                renderMaterialGrid(groups[typeIds[0]].items);
            } else {
                document.getElementById('materialsList').innerHTML = '<p>Нет доступных материалов</p>';
            }
        }

        function renderMaterialGrid(materials) {
            const container = document.getElementById('materialsList');
            container.innerHTML = '';
            materials.forEach(mat => {
                const card = document.createElement('div');
                card.className = 'material-card';
                card.dataset.id = mat.id;
                card.dataset.code = mat.code;
                card.dataset.name = mat.name;
                card.dataset.typeId = mat.materials_type_id;
                card.dataset.typeName = mat.type_name;
                card.dataset.photo = mat.photo_url || '/media/interface/placeholder.png';
                const img = document.createElement('img');
                img.src = card.dataset.photo;
                img.alt = mat.name;
                img.onerror = () => { img.src = '/media/interface/placeholder.png'; };
                const nameSpan = document.createElement('div');
                nameSpan.className = 'material-name';
                nameSpan.textContent = mat.name;
                const codeSpan = document.createElement('div');
                codeSpan.className = 'material-code';
                codeSpan.textContent = `Код: ${mat.code}`;
                card.appendChild(img);
                card.appendChild(nameSpan);
                card.appendChild(codeSpan);
                card.addEventListener('click', () => selectMaterial(mat));
                container.appendChild(card);
            });
        }

        function selectMaterial(mat) {
            selectedMaterial = mat;
            const selectedText = document.getElementById('selectedMaterialText');
            selectedText.innerHTML = `Выбран материал: <strong>${mat.name}</strong> (${mat.code})`;
            if (window.productCosts && window.productCosts.length) {
                const costEntry = window.productCosts.find(c => c.id === mat.materials_type_id);
                if (costEntry) {
                    document.getElementById('priceCurrent').innerHTML = `${costEntry.cost} <sup>₽</sup>`;
                } else {
                    if (minCost !== null && minCost !== undefined) {
                        document.getElementById('priceCurrent').innerHTML = `от ${minCost} <sup>₽</sup>`;
                    } else {
                        document.getElementById('priceCurrent').innerHTML = 'Цена по запросу';
                    }
                }
            } else {
                if (minCost !== null && minCost !== undefined) {
                    document.getElementById('priceCurrent').innerHTML = `от ${minCost} <sup>₽</sup>`;
                } else {
                    document.getElementById('priceCurrent').innerHTML = 'Цена по запросу';
                }
            }
            document.getElementById('addToCartContainer').style.display = 'block';
            closeMaterialModal();
        }

        chooseBtn.addEventListener('click', openMaterialModal);
        if (closeModalSpan) {
            closeModalSpan.addEventListener('click', closeMaterialModal);
        }
        window.addEventListener('click', (e) => {
            if (e.target === modal) closeMaterialModal();
        });
        // Esc для закрытия модалки материалов
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && modal.style.display === 'flex') {
                closeMaterialModal();
            }
        });

        // ---- Добавление в корзину ----
        const addToCartBtn = document.getElementById('btnAddToCart');
        addToCartBtn.addEventListener('click', async () => {
            if (!selectedMaterial || !productData) {
                alert('Сначала выберите материал');
                return;
            }
            const product = productData.product;
            const costEntry = window.productCosts.find(c => c.id === selectedMaterial.materials_type_id);
            if (!costEntry) {
                alert('Для выбранного материала не указана стоимость. Обратитесь к администратору.');
                return;
            }

            let quantity = 1;
            const inputQuantity = prompt('Введите количество:', '1');
            if (inputQuantity === null) return;
            const parsed = parseInt(inputQuantity, 10);
            if (!isNaN(parsed) && parsed > 0) {
                quantity = parsed;
            } else {
                alert('Введите корректное целое число больше 0');
                return;
            }

            const payload = {
                product_code: product.code,
                product_name: product.name,
                material_id: selectedMaterial.id,
                material_code: selectedMaterial.code,
                material_name: selectedMaterial.name,
                cost: costEntry.cost,
                quantity: quantity
            };
            try {
                const resp = await fetch('/api/cart/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await resp.json();
                if (data.success) {
                    alert('Товар добавлен в корзину');
                    updateCartCount();
                } else {
                    alert('Ошибка: ' + (data.error || 'неизвестная ошибка'));
                }
            } catch (err) {
                console.error(err);
                alert('Не удалось добавить товар в корзину');
            }
        });

        // ---- Профиль ----
        async function updateProfileIcon() {
            try {
                const resp = await fetch('/api/auth/me');
                const data = await resp.json();
                if (profileIcon) {
                    if (data.authenticated) {
                        profileIcon.style.background = '#628b35';
                    } else {
                        profileIcon.style.background = '#e3342f';
                    }
                }
            } catch(e) { console.error(e); }
        }

        // ---- Запуск ----
        loadProduct(productCode);
        updateCartCount();
        updateProfileIcon();
        setInterval(updateCartCount, 5000);
    </script>
</body>
</html>
