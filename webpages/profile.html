<html lang="ru">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет | LUTOhayse</title>
    <link rel="icon" type="image/png" href="/media/interface/favicon.png">
    <link rel="stylesheet" href="/index.css">
    <style>
        .cabinet-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .cabinet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .logout-btn {
            background: #e3342f;
            padding: 8px 20px;
            border-radius: 30px;
            color: white;
            text-decoration: none;
        }
        .profile-form, .orders-block {
            background: #f9f9f9;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 40px;
        }
        .profile-form h2, .orders-block h2 {
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 12px;
        }
        .btn-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 5px;
        }
        .btn {
            background: #628b35;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #4a6b27;
        }
        .btn-secondary {
            background: #6c757d;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
        .order-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .order-items {
            font-size: 14px;
            margin-top: 10px;
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px dashed #eee;
        }
        .order-total {
            text-align: right;
            font-weight: bold;
            margin-top: 10px;
        }
        .loader, .empty {
            text-align: center;
            padding: 30px;
        }
        .order-item a {
            color: #628b35;
            text-decoration: none;
        }
        .order-item a:hover {
            text-decoration: underline;
        }

        /* Модальное окно для смены пароля */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background: #fff;
            margin: 15% auto;
            padding: 25px;
            width: 90%;
            max-width: 480px;
            border-radius: 20px;
            position: relative;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .modal .close {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #aaa;
        }
        .modal .close:hover {
            color: black;
        }
        .modal h2 {
            margin-bottom: 20px;
            text-align: center;
        }
        .modal .form-group {
            margin-bottom: 18px;
        }
        .modal .form-group label {
            font-weight: 600;
        }
        .modal .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
        }
        .modal .btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
        }
        .modal .error-msg {
            color: #e3342f;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .modal .success-msg {
            color: #628b35;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<!-- Значок профиля -->
<div class="profile-icon-wrapper" id="profileIcon">
    <a href="/profile" class="profile-fixed-link">
        <img src="/media/interface/profile_icon.svg" alt="Профиль">
    </a>
</div>

<!-- Значок корзины -->
<div class="cart-icon-wrapper">
    <a href="/cart" class="cart-fixed-link">
        <img src="/media/interface/cart_icon.svg" alt="Корзина">
        <span id="cart-count" class="cart-count-badge">0</span>
    </a>
</div>

<header>
    <section class="main__header">
        <div class="header__container">
            <div class="menu__body">
                <nav class="menu__body menu__body-main">
                    <ul class="menu__list">
                        <li class="menu__item site-logo">
                            <h1 class="logo">
                                <a href="/" class="menu__link logo-link">LUTO<span class="logo-sub">hayse</span></a>
                            </h1>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </section>
</header>

<div class="cabinet-container">
    <div class="cabinet-header">
        <h1>Личный кабинет</h1>
        <a href="#" id="logoutBtn" class="logout-btn">Выйти</a>
    </div>

    <div class="profile-form">
        <h2>Мои данные</h2>
        <form id="profileForm">
            <div class="form-group">
                <label>Телефон (логин)</label>
                <input type="tel" id="phone" disabled>
            </div>
            <div class="form-group">
                <label>ФИО</label>
                <input type="text" id="full_name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email">
            </div>
            <div class="form-group">
                <label>Адрес доставки</label>
                <textarea id="address" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label>Удобное время для связи</label>
                <input type="text" id="contact_time" placeholder="например: с 10 до 18">
            </div>
            <div class="btn-row">
                <button type="submit" class="btn">Сохранить</button>
                <button type="button" id="changePasswordBtn" class="btn btn-secondary">Изменить пароль</button>
            </div>
        </form>
    </div>

    <div class="orders-block">
        <h2>История заказов</h2>
        <div id="ordersList" class="loader">Загрузка...</div>
    </div>
</div>

<!-- Модальное окно смены пароля -->
<div id="changePasswordModal" class="modal">
    <div class="modal-content">
        <span class="close" id="closeChangePassword">&times;</span>
        <h2>Смена пароля</h2>
        <div id="passwordModalError" class="error-msg" style="display:none;"></div>
        <div id="passwordModalSuccess" class="success-msg" style="display:none;"></div>
        <form id="changePasswordForm">
            <div class="form-group">
                <label>Текущий пароль</label>
                <input type="password" id="currentPassword" required autocomplete="current-password">
            </div>
            <div class="form-group">
                <label>Новый пароль</label>
                <input type="password" id="newPassword" required autocomplete="new-password">
            </div>
            <div class="form-group">
                <label>Повторите новый пароль</label>
                <input type="password" id="confirmPassword" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn">Сменить пароль</button>
        </form>
    </div>
</div>

<footer>
    <div class="footer-top">
        <div class="footer-left">
            <div class="logo">LUTO<span class="logo-sub">hayse</span></div>
            <div class="phone-label">Звонок по России бесплатный</div>
            <div class="phone-number">8 (999) 700-05-50</div>
            <div style="margin-top: 8px; font-size: 14px; color: #555;">
                Email: <a href="mailto:luto.house@mail.ru" style="color: #628b35; text-decoration: none;">luto.house@mail.ru</a>
            </div>
            <div style="margin-top: 12px;">
                <a href="https://vk.ru/lutohay" target="_blank" style="text-decoration: none; color: #628b35; font-weight: 500;">
                    <img src="/media/interface/vk_icon.svg" alt="ВКонтакте" style="width: 32px; height: 32px; vertical-align: middle; margin-right: 6px;">
                    ВКонтакте
                </a>
            </div>
        </div>
    </div>
    <div class="footer-bottom"><div class="copyright">© Интернет магазин LUTOhayse мебель от производителя</div></div>
</footer>

<script>
    let currentUser = null;
    const profileIcon = document.getElementById('profileIcon');

    // Вспомогательная функция для fetch с обработкой ошибок и чтением JSON
    async function fetchJson(url, options = {}) {
        const response = await fetch(url, {
            ...options,
            credentials: 'include',
            headers: {
                'Content-Type': 'application/json',
                ...(options.headers || {})
            }
        });
        // Пытаемся распарсить ответ как JSON (даже при ошибке)
        let data = null;
        let text = '';
        try {
            text = await response.text();
            data = text ? JSON.parse(text) : null;
        } catch (e) {
            // Если не JSON, оставляем data = null
        }
        if (!response.ok) {
            // Если есть поле error в ответе – используем его, иначе общее сообщение
            const errorMsg = data && data.error ? data.error : `Ошибка ${response.status}: ${text || 'Неизвестная ошибка'}`;
            throw new Error(errorMsg);
        }
        return data;
    }

    async function updateCartCount() {
        try {
            const data = await fetchJson('/api/cart');
            const totalItems = data.items.reduce((sum, item) => sum + (item.quantity || 1), 0);
            const cartCountSpan = document.getElementById('cart-count');
            if (cartCountSpan) cartCountSpan.textContent = totalItems;
        } catch(e) {
            console.error('Не удалось обновить корзину', e);
        }
    }
    updateCartCount();

    async function loadUserAndProfile() {
        try {
            const data = await fetchJson('/api/auth/me');
            if (!data.authenticated) {
                window.location.href = '/login';
                return;
            }
            currentUser = data.user;
            document.getElementById('phone').value = currentUser.phone;
            document.getElementById('full_name').value = currentUser.full_name || '';
            document.getElementById('email').value = currentUser.email || '';
            document.getElementById('address').value = currentUser.address || '';
            document.getElementById('contact_time').value = currentUser.contact_time || '';
            if (profileIcon) profileIcon.style.background = '#628b35';
        } catch (err) {
            console.error(err);
            window.location.href = '/login';
        }
    }

    async function loadOrders() {
        const container = document.getElementById('ordersList');
        try {
            const orders = await fetchJson('/api/orders/history');
            if (orders.length === 0) {
                container.innerHTML = '<div class="empty">У вас пока нет заказов.</div>';
                return;
            }
            let html = '';
            for (const order of orders) {
                html += `
                        <div class="order-card">
                            <div class="order-header">
                                <strong>Заказ №${order.id}</strong>
                                <span>${new Date(order.order_date).toLocaleDateString()}</span>
                                <span>Статус: ${order.status}</span>
                            </div>
                            <div class="order-items">
                    `;
                for (const item of order.items) {
                    const productLink = `/product/${encodeURIComponent(item.product_code)}`;
                    html += `
                            <div class="order-item">
                                <span><a href="${productLink}">${escapeHtml(item.product_name)}</a> (${escapeHtml(item.material_name)})</span>
                                <span>${item.quantity} шт. × ${item.cost}₽ = ${item.quantity * item.cost}₽</span>
                            </div>
                        `;
                }
                html += `
                            </div>
                            <div class="order-total">Итого: ${order.total} ₽</div>
                        </div>
                    `;
            }
            container.innerHTML = html;
        } catch (err) {
            console.error(err);
            container.innerHTML = '<div class="empty">Не удалось загрузить заказы</div>';
        }
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            full_name: document.getElementById('full_name').value.trim(),
            email: document.getElementById('email').value.trim(),
            address: document.getElementById('address').value.trim(),
            contact_time: document.getElementById('contact_time').value.trim()
        };
        try {
            const data = await fetchJson('/api/auth/profile', {
                method: 'PUT',
                body: JSON.stringify(payload)
            });
            if (data.success) {
                alert('Данные обновлены');
            } else {
                alert('Ошибка: ' + (data.error || 'неизвестная ошибка'));
            }
        } catch (err) {
            alert('Ошибка при обновлении данных: ' + err.message);
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        try {
            await fetchJson('/api/auth/logout', { method: 'POST' });
            window.location.href = '/';
        } catch (err) {
            alert('Ошибка выхода: ' + err.message);
        }
    });

    // ========== СМЕНА ПАРОЛЯ (исправленная версия) ==========
    const changePasswordBtn = document.getElementById('changePasswordBtn');
    const modal = document.getElementById('changePasswordModal');
    const closeModal = document.getElementById('closeChangePassword');
    const passwordForm = document.getElementById('changePasswordForm');
    const errorDiv = document.getElementById('passwordModalError');
    const successDiv = document.getElementById('passwordModalSuccess');

    function openModal() {
        modal.style.display = 'block';
        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';
        passwordForm.reset();
        document.body.style.overflow = 'hidden';
    }

    function closeModalFunc() {
        modal.style.display = 'none';
        document.body.style.overflow = '';
    }

    changePasswordBtn.addEventListener('click', openModal);
    closeModal.addEventListener('click', closeModalFunc);
    window.addEventListener('click', (e) => {
        if (e.target === modal) closeModalFunc();
    });

    passwordForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';

        const current = document.getElementById('currentPassword').value;
        const newPwd = document.getElementById('newPassword').value;
        const confirmPwd = document.getElementById('confirmPassword').value;

        if (!current || !newPwd || !confirmPwd) {
            errorDiv.textContent = 'Все поля обязательны для заполнения';
            errorDiv.style.display = 'block';
            return;
        }

        if (newPwd !== confirmPwd) {
            errorDiv.textContent = 'Новый пароль и подтверждение не совпадают';
            errorDiv.style.display = 'block';
            return;
        }
        if (newPwd.length < 6) {
            errorDiv.textContent = 'Пароль должен содержать не менее 6 символов';
            errorDiv.style.display = 'block';
            return;
        }

        try {
            // Используем fetch напрямую, чтобы получить тело ошибки
            const response = await fetch('/api/auth/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    current_password: current,
                    new_password: newPwd,
                    confirm_password: confirmPwd
                })
            });

            const text = await response.text();
            let data = null;
            try {
                data = JSON.parse(text);
            } catch (e) {
                // если ответ не JSON
                data = { error: text || 'Неизвестная ошибка сервера' };
            }

            if (response.ok && data.success) {
                successDiv.textContent = 'Пароль успешно изменён!';
                successDiv.style.display = 'block';
                setTimeout(closeModalFunc, 1500);
            } else {
                // Показываем ошибку из ответа или общее сообщение
                const errorMsg = data && data.error ? data.error : `Ошибка ${response.status}`;
                errorDiv.textContent = errorMsg;
                errorDiv.style.display = 'block';
            }
        } catch (err) {
            // Сетевая ошибка или ошибка запроса
            console.error('Ошибка при смене пароля:', err);
            errorDiv.textContent = 'Ошибка соединения с сервером. Проверьте, запущен ли сервер и доступен ли эндпоинт.';
            errorDiv.style.display = 'block';
        }
    });

    loadUserAndProfile();
    loadOrders();
    setInterval(updateCartCount, 5000);
</script>
</body>
</html>
