    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | LUTOhayse</title>
    <link rel="icon" type="image/png" href="/media/interface/favicon.png">
    <link rel="stylesheet" href="/index.css">
    <style>
        .auth-container {
            max-width: 480px;
            margin: 60px auto;
            padding: 30px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        .auth-container h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
        }
        button {
            background: #628b35;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #4a6b27;
        }
        .error {
            color: #e3342f;
            margin-bottom: 15px;
            text-align: center;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
        }
        .login-link a {
            color: #628b35;
            text-decoration: none;
        }
    </style>
</head>
<body>

<!-- Значок профиля -->
<div class="profile-icon-wrapper">
    <a href="/profile" class="profile-fixed-link">
        <img src="/media/interface/profile_icon.svg" alt="Профиль">
    </a>
</div>

<!-- Значок корзины -->
<div class="cart-icon-wrapper">
    <a href="/cart" class="cart-fixed-link">
        <img src="/media/interface/cart_icon.svg" alt="Корзина">
        <span id="cart-count" class="cart-count-badge">0</span>
    </a>
</div>

<header>
    <section class="main__header">
        <div class="header__container">
            <div class="menu__body">
                <nav class="menu__body menu__body-main">
                    <ul class="menu__list">
                        <li class="menu__item site-logo">
                            <h1 class="logo">
                                <a href="/" class="menu__link logo-link">LUTO<span class="logo-sub">hayse</span></a>
                            </h1>
                        </li>
                    </ul>
                </nav>
                <nav class="menu__body menu__body-user">
                    <ul class="menu__list">
                        <li class="menu__item"><a href="tel:+79997000550" class="menu__link">+7(999)700-05-50</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </section>
</header>

<div class="auth-container">
    <h1>Регистрация</h1>
    <div id="errorMsg" class="error"></div>
    <form id="registerForm">
        <div class="form-group">
            <label>Телефон (логин)</label>
            <input type="tel" id="phone" required placeholder="+7XXXXXXXXXX">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" id="password" required>
        </div>
        <div class="form-group">
            <label>Ваше имя (необязательно)</label>
            <input type="text" id="full_name">
        </div>
        <button type="submit">Зарегистрироваться</button>
    </form>
    <div class="login-link">
        Уже есть аккаунт? <a href="/login">Войти</a>
    </div>
</div>

<script>
    async function updateCartCount() {
        try {
            const resp = await fetch('/api/cart');
            const data = await resp.json();
            const totalItems = data.items.reduce((sum, item) => sum + (item.quantity || 1), 0);
            const cartCountSpan = document.getElementById('cart-count');
            if (cartCountSpan) cartCountSpan.textContent = totalItems;
        } catch(e) { console.error(e); }
    }
    updateCartCount();

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value;
        const full_name = document.getElementById('full_name').value.trim();
        const errorDiv = document.getElementById('errorMsg');
        errorDiv.textContent = '';
        if (!phone || !password) {
            errorDiv.textContent = 'Заполните телефон и пароль';
            return;
        }
        try {
            const resp = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, password, full_name })
            });
            const data = await resp.json();
            if (data.success) {
                window.location.href = '/profile';
            } else {
                errorDiv.textContent = data.error || 'Ошибка регистрации';
            }
        } catch (err) {
            errorDiv.textContent = 'Ошибка соединения';
        }
    });
</script>
</body>
</html>
